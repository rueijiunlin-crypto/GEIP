<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="image/brand/favicon.png" type="image/png">
  <title>最新消息</title>
  <script src="js/title_prefix.js"></script>
  <link rel="stylesheet" href="geip_website_style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="js/includes.js" defer></script>
</head>
<body>

  <!-- 導覽列 -->
  <div data-include="partials/navbar.html"></div>

  <div class="container my-5">
    <h1 class="mb-5 fw-bold text-center">最新消息</h1>
    <div class="news-list-container">
      <div class="news-list" id="news-list">
        <!-- 新聞項目將在這裡動態生成 -->
      </div>
    </div>
    <div id="pagination-container" class="mt-4"></div>
  </div>

  <script>
  fetch('assets/data/news.json')
    .then(response => response.json())
    .then(data => {
      const newsList = document.getElementById('news-list');
      const paginationContainer = document.getElementById('pagination-container');
      const itemsPerPage = 10;

      // 按日期排序（最新的在前）
      data.sort((a, b) => new Date(b.date) - new Date(a.date));

      // 取得並驗證目前頁碼；無效值會安全回到有效範圍。
      const rawPage = new URLSearchParams(window.location.search).get('page');
      const requestedPage = rawPage !== null && /^\d+$/.test(rawPage)
        ? Number(rawPage)
        : 1;
      const totalPages = Math.ceil(data.length / itemsPerPage);
      const lastValidPage = Math.max(totalPages, 1);
      const currentPage = Math.min(Math.max(requestedPage, 1), lastValidPage);

      if (rawPage !== null && (requestedPage !== currentPage || !/^\d+$/.test(rawPage))) {
        const normalizedUrl = new URL(window.location.href);
        normalizedUrl.searchParams.set('page', currentPage);
        window.history.replaceState({}, '', normalizedUrl);
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const currentPageItems = data.slice(startIndex, startIndex + itemsPerPage);

      currentPageItems.forEach(item => {
        // 解析標題中的分類
        let category = '';
        let title = item.title;
        
        // 檢查是否有分類標記
        if (title.includes('【')) {
          const categoryMatch = title.match(/【([^】]+)】/);
          if (categoryMatch) {
            category = categoryMatch[1];
            title = title.replace(/【[^】]+】/, '').trim();
          }
        }
        
        // 格式化日期
        const date = new Date(item.date);
        const formattedDate = date.toLocaleDateString('zh-TW', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });
        
        // 創建新聞項目
        const newsItem = document.createElement('div');
        newsItem.className = 'news-item';
        newsItem.innerHTML = `
          <a href="${item.link}" class="news-link">
            <div class="news-content">
              <div class="news-meta">
                <span class="news-date">${formattedDate}</span>
                ${category ? `<span class="news-category">${category}</span>` : ''}
              </div>
              <h3 class="news-title">${title}</h3>
            </div>
            <div class="news-arrow">
              <i class="fas fa-chevron-right"></i>
            </div>
          </a>
        `;
        
        newsList.appendChild(newsItem);
      });

      // 只有兩頁以上才顯示分頁。
      if (totalPages > 1) {
        const pagination = document.createElement('nav');
        pagination.setAttribute('aria-label', '最新消息分頁');

        const paginationList = document.createElement('ul');
        paginationList.className = 'pagination justify-content-center';

        const createPageItem = (label, page, options = {}) => {
          const listItem = document.createElement('li');
          listItem.className = 'page-item';
          if (options.active) listItem.classList.add('active');
          if (options.disabled) listItem.classList.add('disabled');

          const link = document.createElement('a');
          link.className = 'page-link';
          link.textContent = label;
          link.href = options.disabled ? '#' : `news.html?page=${page}`;

          if (options.active) link.setAttribute('aria-current', 'page');
          if (options.disabled) {
            link.setAttribute('aria-disabled', 'true');
            link.setAttribute('tabindex', '-1');
          }

          listItem.appendChild(link);
          return listItem;
        };

        paginationList.appendChild(createPageItem('上一頁', currentPage - 1, {
          disabled: currentPage === 1
        }));

        for (let page = 1; page <= totalPages; page += 1) {
          paginationList.appendChild(createPageItem(String(page), page, {
            active: page === currentPage
          }));
        }

        paginationList.appendChild(createPageItem('下一頁', currentPage + 1, {
          disabled: currentPage === totalPages
        }));

        pagination.appendChild(paginationList);
        paginationContainer.appendChild(pagination);
      }
    })
    .catch(error => {
      console.error('載入最新消息失敗:', error);
      document.getElementById('news-list').innerHTML = '<p class="error-message">載入新聞失敗，請稍後再試。</p>';
    });
  </script>


  <div data-include="partials/footer.html"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
